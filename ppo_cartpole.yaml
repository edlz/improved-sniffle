run_name: ppo_cartpole_v1

env:
  id: CartPole-v1
  normalize: false        # true for continuous control (MuJoCo etc.)
  wrappers: []            # add TimeLimit, RewardScale, etc. here

algorithm:
  name: ppo
  policy: MlpPolicy       # MlpPolicy for vectors, CnnPolicy for images
  hyperparams:
    learning_rate: 3.0e-4
    n_steps: 2048         # steps per env per update
    batch_size: 64
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.0         # entropy bonus — increase to encourage exploration
    vf_coef: 0.5
    max_grad_norm: 0.5

training:
  total_timesteps: 500_000
  n_envs: 4               # parallel envs — tune to CPU core count
  seed: 42
  eval_freq: 10_000       # eval every N timesteps (per env)
  n_eval_episodes: 10
